name: Build and push Docker image

on:
  push:
    branches:
      - formiga
      - main
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validar testes e compilação
        run: |
          npm ci
          npm test
          npm run build

      - name: Login no registry da DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_USERNAME }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            registry.digitalocean.com/gestcom/chatbot:latest
            registry.digitalocean.com/gestcom/chatbot:sha-${{ github.sha }}
